name: Compilar SF2 Player

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_v0.4_Timbres_CORRIGIDO.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager nao encontrado"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Extrair projeto
        run: |
          ZIP="SF2Player_v0.4_Timbres_CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Erro: ZIP nao encontrado: $ZIP"
            exit 1
          fi

          mkdir -p extraido
          unzip -o "$ZIP" -d extraido

          PROJECT_FILE="$(find extraido -name settings.gradle.kts -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "Erro: settings.gradle.kts nao encontrado"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Preparar TinySoundFont
        run: |
          CPP_DIR="$PROJECT_DIR/app/src/main/cpp"
          mkdir -p "$CPP_DIR"

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/schellingb/TinySoundFont/master/tsf.h \
            -o "$CPP_DIR/tsf.h"

          test -s "$CPP_DIR/tsf.h"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SF2Player-apk-debug
          path: extraido/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
