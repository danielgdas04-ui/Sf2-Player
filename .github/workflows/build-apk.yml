
name: Compilar SF2 Player

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_Com_Audio_Experimental.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -o SF2Player_Com_Audio_Experimental.zip -d extraido
          find extraido -name settings.gradle.kts -print
          PROJECT_DIR="$(dirname "$(find extraido -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Não foi encontrado settings.gradle.kts no ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2Player-apk-debug
          path: extraido/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
