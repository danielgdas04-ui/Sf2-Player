name: Compilar SF2 Player

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_Com_Audio_Experimental.zip'
      - 'SF2Player_v0.9.4_Sem_Teclado_Virtual.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          echo "SDK encontrado em: $SDK"
          echo "Usando: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Localizar arquivo ZIP do projeto
        id: projeto_zip
        run: |
          if [ -f "SF2Player_Com_Audio_Experimental.zip" ]; then
            echo "zip=SF2Player_Com_Audio_Experimental.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "SF2Player_v0.9.4_Sem_Teclado_Virtual.zip" ]; then
            echo "zip=SF2Player_v0.9.4_Sem_Teclado_Virtual.zip" >> "$GITHUB_OUTPUT"
          else
            echo "ERRO: nenhum ZIP do projeto foi encontrado na raiz."
            ls -la
            exit 1
          fi

      - name: Extrair projeto
        run: |
          mkdir -p extraido
          unzip -o "${{ steps.projeto_zip.outputs.zip }}" -d extraido

      - name: Localizar projeto Android
        id: projeto
        run: |
          SETTINGS="$(find extraido -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts nao encontrado."
            find extraido -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Compilar APK
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2-Player-APK
          path: extraido/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
