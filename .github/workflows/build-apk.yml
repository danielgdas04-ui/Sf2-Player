
name: Build SF2 Player v0.9.3 MIDI Presets ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SF2Player_v0.9.3_MIDI_Presets_ARM64.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libtool \
            autoconf \
            automake \
            gettext \
            libglib2.0-dev \
            libsndfile1-dev \
            libpulse-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libreadline-dev \
            libsystemd-dev \
            libdbus-1-dev \
            liblilv-dev

      - name: Extract SF2 Player project
        run: |
          test -f SF2Player_v0.9.3_MIDI_Presets_ARM64.zip
          unzip -q SF2Player_v0.9.3_MIDI_Presets_ARM64.zip -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download FluidSynth source
        run: |
          git clone --depth 1 --branch v2.4.6 \
            https://github.com/FluidSynth/fluidsynth.git fluidsynth-src

      - name: Build FluidSynth for Android ARM64
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$PROJECT_DIR/app/src/main/cpp/include"

          cmake -S fluidsynth-src -B fluidsynth-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -Denable-alsa=OFF \
            -Denable-pulseaudio=OFF \
            -Denable-jack=OFF \
            -Denable-dbus=OFF \
            -Denable-readline=OFF \
            -Denable-ladspa=OFF \
            -Denable-aufile=OFF \
            -Denable-sdl2=OFF \
            -Denable-oss=OFF \
            -Denable-coreaudio=OFF \
            -Denable-waveout=OFF \
            -Denable-winmm=OFF \
            -Denable-ipv6=OFF \
            -Denable-pipewire=OFF \
            -Denable-systemd=OFF \
            -Denable-libsndfile=OFF \
            -Denable-libinstpatch=OFF \
            -Denable-pkgconfig=OFF \
            -Denable-framework=OFF \
            -DBUILD_SHARED_LIBS=ON

          cmake --build fluidsynth-build --parallel 2

          find fluidsynth-build -name 'libfluidsynth.so*' -type f -print
          LIBRARY="$(find fluidsynth-build -name 'libfluidsynth.so*' -type f | head -n 1)"
          test -n "$LIBRARY"
          cp "$LIBRARY" "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libfluidsynth.so"

          find fluidsynth-src -name fluidsynth.h -o -name synth.h
          mkdir -p "$PROJECT_DIR/app/src/main/cpp/include/fluidsynth"
          cp -R fluidsynth-src/include/fluidsynth/. \
            "$PROJECT_DIR/app/src/main/cpp/include/fluidsynth/"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2Player-v0.9.3-MIDI-Presets-ARM64-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
