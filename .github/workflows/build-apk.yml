
name: Build SF2 Player v0.9.3 MIDI Presets ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SF2Player_v0.9.3_MIDI_Presets_ARM64.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip git cmake ninja-build build-essential file

      - name: Extract SF2 Player project
        shell: bash
        run: |
          set -e

          ZIP_FILE="SF2Player_v0.9.3_MIDI_Presets_ARM64.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: ZIP não encontrado na raiz do repositório."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: arquivo settings.gradle não encontrado."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Projeto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Conteúdo da pasta do projeto:"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle fallback
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Configure Android NDK
        shell: bash
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          if [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            echo "ERRO: Android NDK não encontrado."
            exit 1
          fi

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      - name: Download FluidSynth Android source
        run: |
          git clone --depth 1 \
            https://github.com/VolcanoMobile/fluidsynth-android.git \
            fluidsynth-src

      - name: Build FluidSynth for Android ARM64
        shell: bash
        run: |
          set -e

          echo "Verificando a estrutura do projeto FluidSynth:"
          ls -la fluidsynth-src

          cmake -S fluidsynth-src -B fluidsynth-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/fluidsynth-install" \
            -DBUILD_SHARED_LIBS=ON \
            -Denable-alsa=OFF \
            -Denable-pulseaudio=OFF \
            -Denable-jack=OFF \
            -Denable-dbus=OFF \
            -Denable-readline=OFF \
            -Denable-ladspa=OFF \
            -Denable-aufile=OFF \
            -Denable-sdl2=OFF \
            -Denable-oss=OFF \
            -Denable-libsndfile=OFF

          cmake --build fluidsynth-build --parallel 2
          cmake --install fluidsynth-build

      - name: Copy FluidSynth library and headers
        shell: bash
        run: |
          set -e

          JNI_DIR="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          INCLUDE_DIR="$PROJECT_DIR/app/src/main/cpp/include/fluidsynth"

          mkdir -p "$JNI_DIR"
          mkdir -p "$INCLUDE_DIR"

          LIBRARY="$(find -L fluidsynth-build fluidsynth-install \
            -type f -name 'libfluidsynth.so' -print -quit)"

          if [ -z "$LIBRARY" ]; then
            LIBRARY="$(find -L fluidsynth-build fluidsynth-install \
              -type f -name 'libfluidsynth.so.*' -print -quit)"
          fi

          if [ -z "$LIBRARY" ]; then
            echo "ERRO: biblioteca FluidSynth não encontrada."
            find fluidsynth-build fluidsynth-install \
              -iname '*fluidsynth*' || true
            exit 1
          fi

          cp "$LIBRARY" "$JNI_DIR/libfluidsynth.so"

          HEADER_DIR="$(find fluidsynth-src -type d \
            -path '*/include/fluidsynth' -print -quit)"

          if [ -n "$HEADER_DIR" ]; then
            cp -R "$HEADER_DIR/." "$INCLUDE_DIR/"
          else
            echo "AVISO: diretório de cabeçalhos não encontrado."
          fi

          file "$JNI_DIR/libfluidsynth.so"

      - name: Build SF2 Player APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            echo "Gradle Wrapper ausente. Usando Gradle instalado."
            gradle --no-daemon clean assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK gerado:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2Player-v0.9.3-MIDI-Presets-ARM64-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
