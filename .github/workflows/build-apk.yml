name: Build SF2 Player v0.9.2 MIDI Presets

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_v0.9.2_MIDI_Presets_Corrigido.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar Android SDK e NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager nao encontrado"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Extrair projeto
        run: |
          ZIP="SF2Player_v0.9.2_MIDI_Presets_Corrigido.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Erro: arquivo ZIP nao encontrado: $ZIP"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          PROJECT_FILE="$(find extracted -name settings.gradle.kts -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "Erro: settings.gradle.kts nao encontrado"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Compilar FluidSynth para Android ARM64
        run: |
          git clone --depth 1 https://github.com/FluidSynth/fluidsynth.git fluidsynth-src

          cmake -S fluidsynth-src -B fluidsynth-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/fluidsynth-stage" \
            -Denable-libsndfile=0 \
            -Denable-pulseaudio=0 \
            -Denable-alsa=0 \
            -Denable-jack=0 \
            -Denable-oss=0 \
            -Denable-portaudio=0 \
            -Denable-readline=0 \
            -Denable-dbus=0 \
            -Denable-network=0

          cmake --build fluidsynth-build --config Release --parallel 2
          cmake --install fluidsynth-build

          LIB="$(find fluidsynth-build fluidsynth-stage -name libfluidsynth.so -type f -print -quit)"

          if [ -z "$LIB" ]; then
            echo "Erro: libfluidsynth.so nao foi gerada"
            exit 1
          fi

          DEST="$PROJECT_DIR/app/src/main"

          mkdir -p "$DEST/jniLibs/arm64-v8a"
          mkdir -p "$DEST/cpp/fluidsynth/include"

          cp "$LIB" "$DEST/jniLibs/arm64-v8a/libfluidsynth.so"
          cp -R fluidsynth-stage/include/. "$DEST/cpp/fluidsynth/include/"

          if [ ! -f "$DEST/cpp/fluidsynth/include/fluidsynth.h" ]; then
            echo "Erro: fluidsynth.h nao encontrado"
            exit 1
          fi

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SF2Player-v0.9.2-MIDI-Presets-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
