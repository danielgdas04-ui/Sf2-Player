
name: Compilar SF2 Player

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_Com_Audio_Experimental.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar ZIP
        run: |
          test -f SF2Player_Com_Audio_Experimental.zip || {
            echo "ERRO: ZIP do projeto nao encontrado."
            exit 1
          }

      - name: Extrair projeto
        run: |
          mkdir -p extraido
          unzip -o SF2Player_Com_Audio_Experimental.zip -d extraido

          test -f extraido/SF2Player_Projeto/app/build.gradle.kts || {
            echo "ERRO: estrutura do projeto nao encontrada."
            find extraido -maxdepth 5 -type f
            exit 1
          }

      - name: Corrigir import do Compose
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "extraido/SF2Player_Projeto/app/src/main/java/"
              "br/com/sf2player/MainActivity.kt"
          )

          if not path.exists():
              raise SystemExit(f"Arquivo nao encontrado: {path}")

          source = path.read_text(encoding="utf-8")
          correct = (
              "import androidx.compose.foundation.gestures."
              "waitForUpOrCancellation"
          )

          source = re.sub(
              r"(?m)^import\s+[\w.]*waitForUpOrCancellation\s*$",
              correct,
              source
          )

          if correct not in source:
              source = re.sub(
                  r"(?m)^package [^\n]+\n",
                  lambda match: match.group(0) + "\n" + correct + "\n",
                  source,
                  count=1
              )

          path.write_text(source, encoding="utf-8")
          print("Import verificado:")
          for line in source.splitlines():
              if "waitForUpOrCancellation" in line:
                  print(line)
          PY

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Compilar APK
        working-directory: extraido/SF2Player_Projeto
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        run: |
          APK="extraido/SF2Player_Projeto/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2-Player-v0.9.4-APK
          path: extraido/SF2Player_Projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
