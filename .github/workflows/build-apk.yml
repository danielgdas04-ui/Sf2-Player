
name: Compilar SF2 Player

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_Com_Audio_Experimental.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar arquivo do projeto
        run: |
          if [ ! -f "SF2Player_Com_Audio_Experimental.zip" ]; then
            echo "ERRO: ZIP do projeto nao encontrado na raiz."
            exit 1
          fi

      - name: Extrair projeto
        run: |
          mkdir -p extraido
          unzip -o SF2Player_Com_Audio_Experimental.zip -d extraido

          if [ ! -f "extraido/SF2Player_Projeto/app/build.gradle.kts" ]; then
            echo "ERRO: estrutura do projeto nao encontrada."
            find extraido -maxdepth 5 -type f
            exit 1
          fi

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Compilar APK
        working-directory: extraido/SF2Player_Projeto
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        run: |
          APK="extraido/SF2Player_Projeto/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2-Player-v0.9.4-APK
          path: extraido/SF2Player_Projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
