
name: Build SF2 Player v0.9.3 MIDI Presets ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SF2Player_v0.9.3_MIDI_Presets_ARM64.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip git cmake ninja-build build-essential file

      - name: Extract SF2 Player project
        shell: bash
        run: |
          set -e

          ZIP_FILE="SF2Player_v0.9.3_MIDI_Presets_ARM64.zip"
          test -f "$ZIP_FILE" || {
            echo "ERRO: ZIP não encontrado."
            exit 1
          }

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          test -n "$SETTINGS" || {
            echo "ERRO: projeto Gradle não encontrado."
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Configure Android NDK
        shell: bash
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          test -f "$NDK/build/cmake/android.toolchain.cmake" || {
            echo "ERRO: Android NDK não encontrado."
            exit 1
          }

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      - name: Download FluidSynth Android source
        run: |
          git clone --depth 1 \
            https://github.com/VolcanoMobile/fluidsynth-android.git \
            fluidsynth-src

      - name: Build FluidSynth for Android ARM64
        shell: bash
        run: |
          set -e

          cmake -S fluidsynth-src -B fluidsynth-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/fluidsynth-install" \
            -DBUILD_SHARED_LIBS=ON \
            -Denable-alsa=OFF \
            -Denable-pulseaudio=OFF \
            -Denable-jack=OFF \
            -Denable-dbus=OFF \
            -Denable-readline=OFF \
            -Denable-ladspa=OFF \
            -Denable-aufile=OFF \
            -Denable-sdl2=OFF \
            -Denable-oss=OFF \
            -Denable-libsndfile=OFF

          cmake --build fluidsynth-build --parallel 2
          cmake --install fluidsynth-build

      - name: Copy FluidSynth library and headers
        shell: bash
        run: |
          set -e

          CPP_DIR="$PROJECT_DIR/app/src/main/cpp"
          JNI_DIR="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"

          # Caminho esperado pelo CMake do SF2 Player
          INCLUDE_DIR="$CPP_DIR/fluidsynth/include"

          mkdir -p "$JNI_DIR"
          mkdir -p "$INCLUDE_DIR"

          LIBRARY="$(find -L fluidsynth-build fluidsynth-install \
            -type f -name 'libfluidsynth.so' -print -quit)"

          if [ -z "$LIBRARY" ]; then
            LIBRARY="$(find -L fluidsynth-build fluidsynth-install \
              -type f -name 'libfluidsynth.so.*' -print -quit)"
          fi

          if [ -z "$LIBRARY" ]; then
            echo "ERRO: libfluidsynth não encontrada."
            find fluidsynth-build fluidsynth-install \
              -iname '*fluidsynth*' || true
            exit 1
          fi

          cp "$LIBRARY" "$JNI_DIR/libfluidsynth.so"

          # Localiza o cabeçalho principal fluidsynth.h
          HEADER_FILE="$(find fluidsynth-src fluidsynth-install \
            -type f -name fluidsynth.h -print -quit)"

          if [ -z "$HEADER_FILE" ]; then
            echo "ERRO: fluidsynth.h não encontrado."
            find fluidsynth-src fluidsynth-install \
              -iname '*fluidsynth*' || true
            exit 1
          fi

          HEADER_ROOT="$(dirname "$HEADER_FILE")"

          cp "$HEADER_FILE" "$INCLUDE_DIR/fluidsynth.h"

          # Copia os cabeçalhos complementares
          if [ -d "$HEADER_ROOT/fluidsynth" ]; then
            cp -R "$HEADER_ROOT/fluidsynth" "$INCLUDE_DIR/"
          fi

          echo "Biblioteca:"
          file "$JNI_DIR/libfluidsynth.so"

          echo "Cabeçalho principal:"
          ls -l "$INCLUDE_DIR/fluidsynth.h"

          echo "Arquivos de cabeçalho disponíveis:"
          find "$INCLUDE_DIR" -maxdepth 2 -type f

      - name: Verify native include path
        shell: bash
        run: |
          set -e

          HEADER="$PROJECT_DIR/app/src/main/cpp/fluidsynth/include/fluidsynth.h"

          if [ ! -f "$HEADER" ]; then
            echo "ERRO: o CMake ainda não terá acesso a fluidsynth.h."
            exit 1
          fi

          echo "Cabeçalho encontrado: $HEADER"

      - name: Build SF2 Player APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          test -n "$APK" || {
            echo "ERRO: APK não gerado."
            exit 1
          }

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2Player-v0.9.3-MIDI-Presets-ARM64-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
