name: Compilar SF2 Player

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_Com_Audio_Experimental.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f "SF2Player_Com_Audio_Experimental.zip"
          mkdir -p extraido
          unzip -q "SF2Player_Com_Audio_Experimental.zip" -d extraido
          test -f "extraido/SF2Player_Projeto/app/build.gradle.kts"
          test -f "extraido/SF2Player_Projeto/app/src/main/java/br/com/sf2player/MainActivity.kt"

      - name: Corrigir compatibilidade Java e Kotlin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extraido/SF2Player_Projeto")
          gradle_file = root / "app/build.gradle.kts"
          main_file = root / "app/src/main/java/br/com/sf2player/MainActivity.kt"

          gradle = gradle_file.read_text(encoding="utf-8")

          imports = []
          if "import org.gradle.api.tasks.compile.JavaCompile" not in gradle:
              imports.append("import org.gradle.api.tasks.compile.JavaCompile")
          if "import org.jetbrains.kotlin.gradle.tasks.KotlinCompile" not in gradle:
              imports.append("import org.jetbrains.kotlin.gradle.tasks.KotlinCompile")

          if imports:
              gradle = "\n".join(imports) + "\n" + gradle

          if "SF2PLAYER_CI_JVM17_FIX" not in gradle:
              gradle += """

          // SF2PLAYER_CI_JVM17_FIX
          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.withType<KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """

          gradle_file.write_text(gradle, encoding="utf-8")

          source = main_file.read_text(encoding="utf-8")
          source = re.sub(
              r"^import\s+[^\n]*waitForUpOrCancellation[^\n]*\n",
              "",
              source,
              flags=re.MULTILINE,
          )

          correct_import = (
              "import androidx.compose.foundation.gestures.waitForUpOrCancellation"
          )

          if correct_import not in source:
              lines = source.splitlines()
              last_import = max(
                  (i for i, line in enumerate(lines)
                   if line.startswith("import ")),
                  default=-1,
              )
              lines.insert(last_import + 1, correct_import)
              source = "\n".join(lines) + "\n"

          main_file.write_text(source, encoding="utf-8")
          print("Correções de compilação aplicadas.")
          PY

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd extraido/SF2Player_Projeto
          gradle --no-daemon --stacktrace assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v6
        with:
          name: SF2-Player-APK
          path: extraido/SF2Player_Projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
