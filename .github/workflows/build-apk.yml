
name: Compilar SF2 Player

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_v0.9.4_Sem_Teclado_Virtual_JVM17_CORRIGIDO.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configurar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verificar ZIP
        run: |
          if [ ! -f "SF2Player_v0.9.4_Sem_Teclado_Virtual_JVM17_CORRIGIDO.zip" ]; then
            echo "ERRO: ZIP corrigido nao encontrado na raiz do repositorio."
            ls -la
            exit 1
          fi

      - name: Extrair projeto
        run: |
          mkdir -p extraido
          unzip -o SF2Player_v0.9.4_Sem_Teclado_Virtual_JVM17_CORRIGIDO.zip -d extraido

      - name: Localizar projeto Android
        id: projeto
        run: |
          SETTINGS="$(find extraido -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts nao encontrado."
            find extraido -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Obter bibliotecas FluidSynth ARM64
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          set -euo pipefail

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/kotlinds/fluidsynth-kmp.git \
            /tmp/fluidsynth-kmp

          git -C /tmp/fluidsynth-kmp sparse-checkout set \
            libs/android/arm64-v8a

          SOURCE="/tmp/fluidsynth-kmp/libs/android/arm64-v8a"
          DEST="app/src/main/jniLibs/arm64-v8a"

          if [ ! -s "$SOURCE/libfluidsynth.so" ]; then
            echo "ERRO: libfluidsynth.so nao foi encontrada na origem."
            find "$SOURCE" -maxdepth 1 -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$DEST"
          cp "$SOURCE"/*.so "$DEST/"

          echo "Bibliotecas nativas preparadas:"
          ls -lh "$DEST"

          test -s "$DEST/libfluidsynth.so"

      - name: Compilar APK
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2-Player-APK
          path: extraido/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
