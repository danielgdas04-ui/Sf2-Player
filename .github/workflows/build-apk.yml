name: Compilar SF2 Player

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_Com_Audio_Experimental.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar ferramentas Android
        uses: android-actions/setup-android@v3

      - name: Instalar componentes do Android SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Extrair projeto
        run: |
          mkdir -p extraido
          unzip -o SF2Player_Com_Audio_Experimental.zip -d extraido
          echo "Conteudo extraido:"
          find extraido -maxdepth 4 -type f | head -200

      - name: Localizar projeto Android
        id: projeto
        run: |
          PROJECT_DIR="$(find extraido -type f -name settings.gradle -o -name settings.gradle.kts | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts nao encontrado."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar APK Debug
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2-Player-APK
          path: extraido/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
